const D={"Combatente":{"pow":[{"n":"Armamento Pesado","t":"Você recebe proficiência com armas pesadas.","p":"For 2"},{"n":"Artista Marcial","t":"Seus ataques desarmados causam 1d6 pontos de dano, podem causar dano letal e contam como armas dgeis. Em NEX 35%, o dano aumenta para 1d8 e, em NEX 70%, para 1d10.","p":""},{"n":"Ataque de Oportunidade","t":"Sempre que um ser sair voluntariamente de um espaco adjacente ao seu, você pode gastar uma reacio e 1 PE para fazer um ataque corpo a corpo contra ele.","p":""},{"n":"Combater com Duas Armas","t":"Se estiver usando duas armas (e pelo menos uma for leve) e fizer a ação agredir, você pode fazer dois ataques, um com cada arma. Se fizer isso, sofre -@ em todos os testes de ataque até o seu próximo turno. Pré- -requisitos: Agi 3, treinado em Luta ou Pontaria.","p":""},{"n":"Combate Defensivo","t":"Quando usa a ação agredir, você pode combater defensivamente. Se fizer isso, até seu próximo turno, sofre -@ em todos os testes de ataque, mas recebe +5 na Defesa.","p":"Int 2"},{"n":"Golpe Demolidor","t":"Quando usa a manobra quebrar ou ataca um objeto, você pode gastar 1 PE para causar dois dados de dano extra do mesmo tipo de sua arma.","p":"For 2, treinado em Luta"},{"n":"Golpe Pesado","t":"O dano de suas armas corpo a corpo aumenta em mais um dado do mesmo tipo.","p":""},{"n":"Incansável","t":"Uma vez por cena, você pode gastar 2 PE para fazer uma ação de investigacao adicional, mas deve usar Força ou Agilidade como atributo-base do teste. Presi a Atlética. Quando faz. um teste de facilitar a investigagao, você pode gastar 1 PE para usar Forca ou Agilidade no lugar do atributo-base da perícia. Se passar no teste, o próximo aliado que usar seu bônus também recebe +@ no teste.","p":""},{"n":"Proteção Pesada","t":"Você recebe proficiência com","p":"NEX 30%"},{"n":"Reflexos Defensivos","t":"Você recebe +2 em Defesa e-em testes de resistência.","p":"Agi 2"},{"n":"Saque Rápido","t":"Você pode sacar ou guardar itens como uma acio livre (em vez de ação de movimento). Além disso, caso esteja usando a regra opcional de contagem de municao, uma vez por rodada pode recarregar uma arma de disparo como uma ação livre.","p":"treinado em Iniciativa"},{"n":"Segurar o Gatilho","t":"Sempre que acerta um ataque com uma arma de fogo, pode fazer outro ataque -CARACTERISTICAS 4 PV (+Vig) A cada novo nivel de exposicio PONTOS DE ESFORCOINICIAIS _2+PRESENCA A cada novo nivel de exposição 2 PE (+Pre) SANIDADE INICIAL 12 AN A cada novo nivel de exposi PERICIAS TREINADAS Luta ou Pontaria (uma das duas) e Fortitude ou Reflexos (uma das duas), mais uma quantidade de perícias 4 sua escolha igual a 1 + Intelecto. PROFICIENCIAS Armas simples, armas taticas e proteges leves. TABELA 1.3: O COMBATENTE Habilidades Ataque especial (2 PE, +5) Habilidade de trilha Poder de combatente Aumento de atributo Ataque especial (3 PE, +10) Poder de combatente Grau de treinamento Habilidade de trilha Poder de combatente Aumento de atributo, versatilidade Ataque especial (4 PE, +15) Poder de combatente Habilidade de trilha Grau de treinamento Poder de combatente Aumento de atributo Ataque especial (5 PE, +20) Poder de combatente Aumento de atributo Habilidade de trilha com a mesma arma contra o mesmo alvo, pagando 2 PE por cada ataque jé realizado no turno. Ou seja, pode fazer o primeiro ataque extra gastando 2 PEe, se acertar, pode fazer um segundo ataque extra gastando mais 4 PE e assim por diante, até errar um ataque ou atingir o limite de seus PE por rodada.","p":"NEX 60%"},{"n":"Sentido Tático","t":"Você pode gastar uma ação de movimento e 2 PE para analisar o ambiente. Se fizer isso, recebe um bônus em Defesa e em testes de resistência igual ao seu Intelecto até o final da cena.","p":"Int 2, treinado em Percepgao e Tática"},{"n":"Tanque de Guerra","t":"Se estiver usando uma protecao pesada, a Defesa e a resistência a dano que ela fornece aumentam em +2.","p":"Protecao Pesada"},{"n":"Tiro Certeiro","t":"Se estiver usando uma arma de disparo, você soma sua Agilidade nas rolagens de dano e ignora a penalidade contra alvos envolvidos em combate corpo a corpo (mesmo se não usar a ação mirar).","p":"treinado em Pontaria"},{"n":"Tiro de Cobertura","t":"Você pode gastar uma ação padrão e 1 PE para disparar uma arma de fogo na direcéo de um personagem no alcance da arma para forcd-lo a se proteger. Faça um teste de Pontaria contra a Vontade do alvo. Se vencer, até o início do seu próximo turno o alvo não pode sair do lugar onde esta e sofre —5 em testes de ataque. A critério do mestre, o alvo recebe +5 no teste de Vontade se estiver em um lugar extremamente perigoso, como uma casa em chamas ou um barco afundando. Este é um efeito de medo.","p":""},{"n":"Transcender","t":"Escolha um poder paranormal (veja a pagina 114). Você recebe o poder escolhido, mas não ganha Sanidade neste aumento de NEX. Você pode escolher este poder varias vezes.","p":""},{"n":"Treinamento em Perícia","t":"Escolha duas perícias. Você se torna treinado nessas perícias. A partir de NEX 35%, você pode escolher perícias nas quais jd é treinado para se tornar veterano. A partir de NEX 70%, pode escolher perícias nas quais jé é veterano para se tornar expert. Você pode escolher este poder varias vezes.","p":""}],"tr":[{"n":"Aniquilador","prof":"Você é treinado para abater alvos com eficiéncia e velocidade, Suas armas são suas melhores amigas € você cuida tao bem delas quanto de seus companheiros de equipe. Talvez até melhor.","ab":[{"nex":10,"n":"A Favorita","t":"Escolha uma arma para ser sua favorita, como katana ou fuzil de assalto. A categoria da arma escolhida é reduzida em I. (Marque a arma favorita na aba Inventário.)"},{"nex":40,"n":"Técnica Secreta","t":"A categoria da arma favorita passa a ser reduzida em II. Quando faz um ataque com ela, você pode gastar 2 PE para executar um dos efeitos abaixo como parte do ataque. Você pode adicionar mais efeitos gastando +2 PE por efeito adicional. Amplo: o ataque pode atingir um alvo adicional em seu alcance e adjacente ao original (use o mesmo teste de ataque para ambos). Destruidor: aumenta o multiplicador de crítico da arma em +1."},{"nex":65,"n":"Técnica Sublime","t":"Você adiciona os seguintes efeitos à lista de sua Técnica Secreta (2 PE cada): Letal: aumenta a margem de ameaça em +2. Você pode escolher este efeito duas vezes para aumentar a margem de ameaça em +5. Perfurante: ignora até 5 pontos de resistência a dano de qualquer tipo do alvo."},{"nex":99,"n":"Máquina de Matar","t":"A categoria da arma favorita passa a ser reduzida em III, ela recebe +2 na margem de ameaça e seu dano aumenta em um dado do mesmo tipo."}]},{"n":"Comandante de Campo","prof":"rapidas e tirando melhor proveito da situação e do talento de seus aliados.","ab":[{"nex":10,"n":"Inspirar Confiança","t":"Sua lideranga inspira seus aliados. Você pode gastar uma reação e 2 PE para fazer um aliado em aleance curto rolar novamente um teste recém realizado."},{"nex":40,"n":"Estrategista","t":"Você pode direcionar aliados em alcance curto. Gaste uma ação padrão e 1 PE por aliado que quiser direcionar (limitado pelo seu Intelecto). No próximo turno dos aliados afetados, eles ganham uma ação de movimento adicional."},{"nex":65,"n":"Brecha na Guarda","t":"Uma vez por rodada, quando um aliado causar dano em um inimigo que esteja em seu alcance curto, você pode gastar uma reação € 2 PE para que você ou outro aliado em alcance curto faça um ataque adicional contra o mesmo inimigo. Além disso, o alcance de inspirar confianga e estrategista aumenta para médio."},{"nex":99,"n":"Oficial Comandante","t":"Você pode gastar uma ação padrão e 5 PE para que cada aliado que você possa ver em alcance médio receba uma ação padrão adicional no próximo turno dele."}]},{"n":"Guerreiro","prof":"Você treinou sua musculatura e movimentos a ponto de transformar seu corpo em uma verdadeira arma. Com golpes corpo a corpo tio poderosos quanto uma bala, você encara os perigos de frente.","ab":[{"nex":10,"n":"Técnica Letal","t":"Você recebe um aumento de +2 na margem de ameaça com todos os seus ataques corpo a corpo."},{"nex":40,"n":"Revidar","t":"Sempre que bloquear um ataque, você pode gastar uma reação e 2 PE para fazer um ataque corpo a corpo no inimigo que o atacou."},{"nex":65,"n":"Força Opressora","t":"Quando acerta um ataque corpo a corpo, você pode gastar 1 PE para realizar uma manobra derrubar ou empurrar contra o alvo do ataque como ação livre. Se escolher empurrar, recebe um bônus de +5 para cada 10 pontos de dano que causou no alvo. Se escolher derrubar e vencer no teste oposto, você pode gastar 1 PE para fazer um ataque adicional contra o alvo caido."},{"nex":99,"n":"Potência Máxima","t":"Quando usa seu Ataque Especial com armas corpo a corpo, todos os bônus numéricos sdo dobrados. Por exemplo, se usar 5 PE para receber +5 no ataque e +15 no dano, você recebe +10 no ataque e +30 no dano."}]},{"n":"Operações Especiais","prof":"Você é um combatente eficaz. Suas ações são calculadas e otimizadas, sempre antevendo os movimentos inimigos e se posicionando da maneira mais inteligente no campo de batalha.","ab":[{"nex":10,"n":"Iniciativa Aprimorada","t":"Você recebe +5 em Iniciativa e uma ação de movimento adicional na primeira rodada."},{"nex":40,"n":"Ataque Extra","t":"Uma vez por rodada, quando faz um ataque, você pode gastar 2 PE para fazer um ataque adicional."},{"nex":65,"n":"Surto de Adrenalina","t":"Uma vez por rodada, você pode gastar 5 PE para realizar uma ação padrão ou de movimento adicional."},{"nex":99,"n":"Sempre Alerta","t":"Você recebe uma ação padrão adicional no inicio de cada cena de combate."}]},{"n":"Tropa de Choque","prof":"Você é duro na queda. Treinou seu corpo para resistir a traumas fisicos, tornando-o praticamente inquebravel, e por isso não teme se colocar entre seus aliados e o perigo.","ab":[{"nex":10,"n":"Casca Grossa","t":"Você recebe +1 PV para cada 5% de NEX e, quando faz um bloqueio, soma seu Vigor na resistência a dano recebida."},{"nex":40,"n":"Cai Dentro","t":"Sempre que um oponente em alcance curto ataca um de seus aliados, você pode gastar uma reação e 1 PE para fazer com que esse oponente faça um teste de Vontade (DT Vig). Se falhar, o oponente deve atacar você em vez de seu aliado. Este poder só funciona se você puder ser efetivamente atacado e estiver no alcance do ataque (por exemplo, adjacente a um oponente atacando em corpo a corpo ou dentro do alcance de uma arma de ataque a distância). Um oponente que passe no teste de Vontade não pode ser afetado por seu poder Cai Dentro até o final da cena."},{"nex":65,"n":"Duro de Matar","t":"Ao sofrer dano não paranormal, você pode gastar uma reação e 2 PE para reduzir esse dano à metade. Em NEX 85%, você pode usar esta habilidade para reduzir dano paranormal."},{"nex":99,"n":"Inquebrável","t":"INQUEBRAVEL, Enquanto estiver machucado, você recebe +5 na Defesa e resistência a dano 5, Enquanto estiver morrendo, em vez do normal, você não fica indefeso e ainda pode realizar ações. Você ainda segue as regras de morte normalmente."}]}]},"Especialista":{"pow":[{"n":"Balística Avançada","t":"Você recebe proficiência com armas táticas de fogo e +2 em rolagens de dano com essas armas.","p":""},{"n":"Conhecimento Aplicado","t":"Quando faz um teste de perícia (exceto Luta e Pontaria), você pode gastar 2 PE para mudar o atributo-base da perícia para","p":"Int 2"},{"n":"Hacker","t":"Você recebe +5 em testes de Tecnologia para invadir sistemas e diminui o tempo necessario para hackear qualquer sistema para uma ação completa.","p":"treinado em Tecnologia"},{"n":"Mãos Rápidas","t":"Ao fazer um teste de Crime, você pode pagar 1 PE para fazé-lo como uma ação livre.","p":"Agi 3, treinado em Crime"},{"n":"Mochila de Utilidades","t":"Um item a sua escolha (exceto armas) conta como uma categoria abaixo e ocupa 1 espago a menos.","p":""},{"n":"Movimento Tático","t":"Você pode gastar 1 PE para ignorar a penalidade em deslocamento por terreno dificil e por escalar até o final do turno.","p":"treinado em Atletismo"},{"n":"Nerd","t":"Você é um repositério de conhecimento itil (eimatil). Uma vez por cena, pode gastar 2 PE para fazer um teste de Atualidades (DT 20). Se passar, recebe uma informacio ttil para essa cena (se for uma investigagao, uma dica para uma pista; se for um combate, uma fraqueza de um inimigo, e assim por diante). A fonte da informagao pode ser desde um livro antigo que você leu na biblioteca até um episédio de sua série de ficcao favorita. z Ninja Urbano. Você recebe proficiência com armas taticas de ataque corpo a corpo e de dis- -CARACTERISTICAS PONTOS DE VIDAINICIAIS 16. A cada novo nivel de exposic PV (+Vig) PONTOS DE ESFORCOINICIAIS _3+PRESENCA A cada novo nivel de exposi 3 PE (+Pre) SANIDADE INICIAL 16 AN A cada novo nivel de exposi 45A\\ PERICIAS TREINADAS Uma quantidade de perícias a sua escolha igual a7 + Intelecto. PROFICIENCIAS Armas simples e proti TABELA 1.4: O ESPECIALISTA NEX Habilidades 5% — Eclético, perito (2 PE, +1d6) 10% — Habilidade de trilha 15% specialista 20% Aumento de atributo 25% —Perito (3 PE, +148) 30% Poder de especialista 35% Grau de treinamento 40% Engenhosidade (veterano), habilidade de trilha 45% Poder de especialista 50% | Aumento de atributo, versatilidade Perito (4 PE, +1d10) Poder de especialista Habilidade de trilha Grau de treinamento Engenhosidade (expert), Aumento de atributo Perito (5 PE, +1412) Poder de especialista Aumento de atributo Habilidade de trilha 30 paro (exceto de fogo) +2 em rolagens de dano com essas armas.","p":""},{"n":"Pensamento Ágil","t":"Uma vez por rodada, durante uma cena de investigacao, você pode gastar 2 PE para fazer uma ação de procurar pistas adicional.","p":""},{"n":"Perito em Explosivos","t":"Você soma seu Intelecto na DT para resistir aos seus explosivos e pode excluir dos efeitos da explosdo um mimero de alvos igual ao seu valor de Intelecto. 3","p":""},{"n":"Primeira Impressão","t":"Você recebe +2d20 no primeiro teste de Diplomacia, Enganação, Intimidação ou Intuição que fizer em uma cena.","p":""},{"n":"Transcender","t":"Escolha um poder paranormal (veja a pagina 114). Você recebe o poder escolhido, mas não ganha Sanidade neste aumento de NEX. Você pode escolher este poder varias vezes.","p":""},{"n":"Treinamento em Perícia","t":"Escolha duas perícias. Você se torna treinado nessas perícias. A partir de NEX 35%, você pode escolher perfcias nas quais j4é treinado para se tornar veterano. A partir de NEX 70%, pode escolher perícias nas quais já é veterano para se tornar expert. Você pode escolher este poder varias vezes.","p":""}],"tr":[{"n":"Atirador de Elite","prof":"Um tiro, uma morte. Ao contrario dos combatentes, você é perito em neutralizar ameaças de longe, termi- nando uma briga antes mesmo que ela comece. Você trata sua arma como uma ferramenta de precisao, sendo capaz de executar faganhas incriveis.","ab":[{"nex":10,"n":"Mira de Elite","t":"Você recebe proficiência com armas de fogo que usam balas longas e soma seu Intelecto em rolagens de dano com essas armas."},{"nex":40,"n":"Disparo Letal","t":"Quando faz a ação mirar você pode gastar 1 PE para aumentar em +2 a margem de ameaca do próximo ataque que fizer até 0 final de seu próximo turno."},{"nex":65,"n":"Disparo Impactante","t":"Se estiver usando uma arma de fogo com calibre grosso você pode gastar 2 PE para fazer as manobras derrubar, desarmar, empurrar e quebrar usando um ataque a distância."},{"nex":99,"n":"Atirar para Matar","t":"Quando faz um acerto crítico com uma arma de fogo, você causa dano máximo, sem precisar rolar dados."}]},{"n":"Infiltrador","prof":"Você é um perito em infiltracgdo e sabe neutralizar alvos desprevenidos sem causar alarde. Combinando talento acrobatico, destreza manual e conhecimento técnico você é capaz de superar qualquer barreira de defesa, mesmo quando a missão parece impossivel.","ab":[{"nex":10,"n":"Ataque Furtivo","t":"Você sabe atingir os pontos vitais de um inimigo distraido. Uma vez por rodada, quando atinge um alvo desprevenido com um ataque corpo a corpo ou em alcance curto, ou um alvo que você esteja flanqueando, você pode gastar 1 PE para causar +1d6 pontos de dano do mesmo tipo da arma. Em NEX 40% o dano adicional aumenta para +2d6, em NEX 65% aumenta para +3d6 e em NEX 99% aumenta para +4d6."},{"nex":40,"n":"Gatuno","t":"Você recebe +5 em Atletismo e Crime e pode percorrer seu deslocamento normal quando se esconder sem penalidade (veja a perícia Furtividade)."},{"nex":65,"n":"Assassinar","t":"Você pode gastar uma ação de movimento e 3 PE para analisar um alvo em alcance curto. Até o fim de seu próximo turno, seu primeiro Ataque Furtivo que causar dano a ele tem seus dados de dano extras dessa habilidade dobrados. Além disso, se sofrer dano de seu ataque, oalvo fica inconsciente ou morrendo, a sua escolha (Fortitude DT Agi evita)."},{"nex":99,"n":"Sombra Fugaz","t":"Quando faz um teste de Furtividade apés atacar ou fazer outra ação chamativa, você pode gastar 3 PE para não sofrer a penalidade de -15 no teste."}]},{"n":"Médico de Campo","prof":"Você ¢ treinado em técnicas de primeiros socorros e tratamento de emergéncia, o que torna você um membro valioso para qualquer grupo de agentes. Ao contrdrio dos profissionais de satide convencionais, você esta acostumado com o campo de batalha e sabe tomar decisoes répidas no meio do caos. Especiau: para escolher esta trilha, você precisa ser treinado em Medicina. Para usar as habilidades desta trilha, você precisa possuir um kit de medicina.","ab":[{"nex":10,"n":"Paramédico","t":"Você pode usar uma ação padrão e 2 PE para curar 2d10 pontos de vida de um aliado adjacente. Você pode curar +1d10 PV respectivamente em NEX 40%, 65% e 99%, gastando +1 PE por dado adicional de cura."},{"nex":40,"n":"Equipe de Trauma","t":"Você pode usar uma ação padrão e 2 PE para remover uma condicao negativa (exceto morrendo) de um aliado adjacente."},{"nex":65,"n":"Resgate","t":"Uma vez por rodada, se estiver emalcance curto de um aliado machucado ou morrendo, você pode se aproximar do aliado com uma ação livre (desde que seja capaz de fazé-lo usando seu deslocamento normal). Além disso, sempre que curar PV ou remover condicées do aliado, você e 0 aliado recebem +5 na Defesa até o início de seu próximo turno. Por fim, para você, 0 total de espagos ocupados por carregar um personagem é reduzido pela metade."},{"nex":99,"n":"Reanimação","t":"Uma vez por cena, você pode gastar uma ação completa e 10 PE para trazer de volta a vida um personagem que tenha morrido ma mesma cena (exceto morte por dano massivo)."}]},{"n":"Negociador","prof":"Você é um diplomata habilidoso e consegue influenciar outras pessoas, seja por labia ou intimidacao. Sua capacidade de avaliar situagdes com rapidez e eficiéncia pode tirar o grupo de apuros que nem a mais poderosa das armas poderia resolver.","ab":[{"nex":10,"n":"Eloquência","t":"Você pode usar uma ação completa e 1 PE por alvo em alcance curto para afetar outros personagens com sua fala. Faça um teste de Diplomacia, Enganacao ou Intimidagao contra a Vontade dos alvos. Se você vencer, os alvos ficam fascinados enquanto você se concentrar (uma ação padrão por rodada). Um alvo hostil ou que esteja envolvido em combate recebe +5 em seu teste de resistência e tem. direito a um novo teste por rodada, sempre que você se concentrar Um personagem que passar no teste fica imune a este efeito por um dia."},{"nex":40,"n":"Discurso Motivador","t":"Você pode gastar uma ação padrão e 4 PE para inspirar seus aliados com suas palavras. Você e todos os seus aliados em alcance curto ganham +1d20 em testes de perícia até o fim da cena. A partir de NEX 65%, você pode gastar 8 PE para fornecer um bônus total de +2d20."},{"nex":65,"n":"Eu Conheço um Cara","t":"Uma vez por missão, você pode ativar sua rede de contatos para pedir um favor, como por exemplo trocar todo 0 equipamento do seu grupo (como se tivesse uma segunda fase de preparacao de misao), conseguir um local de descanso ou mesmo ser resgatado de uma cena. O mestre tem a palavra final de quando é possivel usar essa habilidade e quais favores podem ser obtidos."},{"nex":99,"n":"Truque de Mestre","t":"Acostumado a uma vida de fingimento e manipulacao, você pode gastar 5 PE para simular o efeito de qualquer habilidade que você tenha visto um de seus aliados usar durante a cena. Você ignora os pré-requisitos da habilidade, mas ainda precisa pagar todos os seus custos, incluindo ações, PE e materiais, e ela usa os seus parametros de jogo, como se você estivesse usando a habilidade em questo."}]},{"n":"Técnico","prof":"Sua principal habilidade é a manutengdo e reparo do valioso equipamento que seu time carrega em missio. Seu conhecimento técnico também permite que improvise ferramentas com o que tiver a disposicao e sabote os itens usados por seus inimigos.","ab":[{"nex":10,"n":"Inventário Otimizado","t":"Você soma seu Intelecto a sua Força para calcular sua capacidade de carga. Por exemplo, se você tem Força 1 e Intelecto 3, seu inventário tem 20 espaços."},{"nex":40,"n":"Remendão","t":"Você pode gastar uma ação completa e 1 PE para remover a condição quebrado de um equipamento adjacente até o final da cena. Além disso, qualquer equipamento geral tem sua categoria reduzida em I para você."},{"nex":65,"n":"Improvisar","t":"Você pode improvisar equipamentos com materiais ao seu redor. Escolha um equipamento geral e gaste uma ação completa e 2 PE, mais 2 PE por categoria do item escolhido. Você cria uma versio funcional do equipamento, que segue suas regras de espaco e categoria como normal. Ao final da cena, seu equipamento improvisado se torna inutil."},{"nex":99,"n":"Preparado para Tudo","t":"Você sempre tem o que precisa para qualquer situação. Sempre que precisar de um item qualquer (exceto armas), pode gastar uma ação de movimento e 3 PE por categoria do item para lembrar que colocou ele no fundo da bolsa! Depois de encontrado, o item segue normalmente as regras de inventario."}]}],"eng":"Engenhosidade (expert),"},"Ocultista":{"pow":[{"n":"Camuflar Ocultismo","t":"Você pode gastar uma ação livre para esconder simbolos e sigilos que estejam desenhados ou gravados em objetos ou em sua pele, tornando-os invisiveis para outras pessoas além de você mesmo. Além disso, quando langa um ritual, pode gastar +2 PE para langa-lo sem usar componentes ritualisticos e sem gesticular (o que permite conjurar um ritual com as mios presas), usando apenas concentraao. Outros seres sé perceberao que você lancou uma ritual se passarem num teste de Ocultismo (DT 25).","p":""},{"n":"Criar Selo","t":"Você sabe fabricar selos paranormais de rituais que conheca (veja.a pagina 151). Fabricar um selo gasta uma ação de interhidio e um ntimero de PE iguais ao custo de conjurar o ritual. Você pode ter um mimero máximo de selos criados a qualquer momento igual & sua Presença.","p":""},{"n":"Envolto em Mistério","t":"Sua aparéncia e postura assombrosas 0 permitem manipular e assustar pessoas ignorantes ou supersticiosas. O mestre define o que exatamente você pode fazer e quem se encaixa nessa descrigao. Como regra geral, você recebe +5 em Enganacao e Intimidagao contra pessoas no treinadas em Ocultismo.","p":""},{"n":"Especialista em Elemento","t":"Escolha um elemento. ADT para resistir aos seus rituais desse elemento aumenta em +2. z Ferramentas Paranormais. Você reduza categoria de um item paranormal em Le pode ativar itens paranormais sem pagar seu custo em PE. g Fluxo de Poder. Você pode manter dois efeitos sustentados de rituais ativos simultaneamente com apenas uma acio livre, pagando o custo de cada efeito separadamente.","p":"NEX 60%"},{"n":"Guiado pelo Paranormal","t":"Uma vez por cena, você pode gastar 2 PE para fazer uma ação de investigagao adicional.","p":""},{"n":"Identificação Paranormal","t":"Você recebe +10 em testes de Ocultismo para identificar criaturas, objetos ou rituais.","p":""},{"n":"Improvisar Componentes","t":"Uma vez por cena, você pode gastar uma ação completa para fazer um teste de Investigacao (DT 15). Se passar, encontra objetos que podem servir como componentes ritualisticos de um elemento a sua escolha. O mestre define se é possivel usar esse poder na cena atual.","p":""},{"n":"Intuição Paranormal","t":"Sempre que usa a ação facilitar investigação, você soma seu Intelecto ou Presença no teste (a sua escolha).","p":""},{"n":"Mestre em Elemento","t":"Escolha um elemento. O custo para lancar rituais desse elemento diminui em —1 PE.","p":"Especialista em Elemento no elemento escolhido, NEX 45%"},{"n":"Ritual Potente","t":"Você soma seu Intelecto nas rolagens de dano ou nos efeitos de cura de seus rituais.","p":"Int 2"},{"n":"Ritual Predileto","t":"Escolha um ritual que você conhece. Você reduz em —1 PE o custo do ritual. Essa redugdo se acumula com reducées fornecidas por outras fontes. z Tatuagem Ritualistica. Simbolos marcados em sua pele reduzem em ~1 PE 0 custo de rituais de alcance pessoal que tém você como alvo.","p":""},{"n":"Transcender","t":"Escolha um poder paranormal (veja a pagina 114). Você recebe 0 poder escolhido, mas não ganha Sanidade neste aumento de NEX. Você pode escolher este poder varias vezes.","p":""},{"n":"Treinamento em Perícia","t":"Escolha duas perícias. Você se torna treinado nessas perícias. A partir de NEX 35%, você pode escolher perícias nas quais jd 6 treinado para se tornar veterano. A partir de NEX 70%, pode escolher perícias nas quais j4 é veterano para se tornar expert. Você pode escolher este poder varias vezes.","p":""}],"tr":[{"n":"Conduíte","prof":"Você domina os aspectos fundamentais da conjuracao de rituais e é capaz de aumentar o alcance e velocidade de suas conjuragées. Conforme sua conexao com as entidades paranormais aumenta você se torna capaz de interferir com os rituais de outros ocultistas.","ab":[{"nex":10,"n":"Ampliar Ritual","t":"Quando langa um ritual, você pode gastar +2 PE para aumentar seu alcance em um passo (de curto para médio, de médio para longo ou de longo para extremo) ou dobrar sua 4rea de efeito."},{"nex":40,"n":"Acelerar Ritual","t":"Uma vez por rodada, você pode aumentar o custo de um ritual em 4 PE para conjura-lo como uma ação livre."},{"nex":65,"n":"Anular Ritual","t":"Quando for alvo de um ritual, você pode gastar uma quantidade de PE igual ao custo pago por esse ritual e fazer um teste oposto de Ocultismo contra o conjurador. Se vencer, você anula o ritual, cancelando todos os seus efeitos."},{"nex":99,"n":"Canalizar o Medo","t":"Você aprende o ritual Canalizar o Medo."}]},{"n":"Flagelador","prof":"Dor é um poderoso catalisador paranormal e você aprendeua transformé-la em poder para seus ritu: Quando se torna especialmente poderoso, consegue usar a dor e 0 sofrimento de seus inimigos como instrumento de seus rituais ocultistas.","ab":[{"nex":10,"n":"Poder do Flagelo","t":"Ao conjurar um ritual, você pode gastar seus proprios pontos de vida para pagar o custo em pontos de esforgo, a taxa de 2 PV por PE pago. Pontos de vida gastos dessa forma s6 podem ser recuperados com descanso."},{"nex":40,"n":"Abraçar a Dor","t":"Sempre que sofrer dano não paranormal, você pode gastar uma reacio e 2 PE para reduzir esse dano a metade."},{"nex":65,"n":"Absorver Agonia","t":"Sempre que reduz um ou mais inimigos a 0 PV com um ritual, você recebe uma quantidade de PE temporarios igual ao circulo do ritual utilizado. Por exemplo, se ativar esse poder com um ritual de 2° circulo, recebera 2 PE."},{"nex":99,"n":"Medo Tangível","t":"Você aprende o ritual Medo Tangivel."}]},{"n":"Graduado","prof":"Você foca seus estudos em se tornar um conjurador versatile poderoso, conhecendo mais rituais que os outros ocultistas e sendo capaz de torna-los mais dificeis de serem resisti- dos. Seu objetivo é desvendar e dominar os segredos do Outro Lado, custe o que custar.","ab":[{"nex":10,"n":"Saber Ampliado","t":"Você aprende um ritual de 1° circulo, Toda vez que ganha acesso a um novo circulo, aprende um ritual adicional daquele circulo. Esses rituais não contam no seu limite de rituais."},{"nex":40,"n":"Grimório Ritualístico","t":"Você cria um grimério especial, que armazena rituais que sua mente não seria capaz de guardar. Você aprende uma quantidade de rituais de 1° ou 2° circulos igual ao seu Intelecto. Quando ganha acesso a um novo circulo, pode incluir um novo ritual desse circulo em seu grimério. Esses rituais nado contam em seu limite de rituais conhecidos. Para conjurar um ritual armazenado em seu grimério, você precisa antes empunhar o grimério e gastar uma ação completa o folheando para relembrando o ritual. O grimério ocupa 1 espaco em seu inventirio. Se perdé-lo, você pode replicé-lo com duas agées de interlidio."},{"nex":65,"n":"Rituais Eficientes","t":"A DT para resistir a todos os seus rituais aumenta em +5."},{"nex":99,"n":"Conhecendo o Medo","t":"Você aprende o ritual Conhecendo o Medo."}]},{"n":"Intuitivo","prof":"Assim como combatentes treinam seus corpos para resistir a traumas fisicos, você preparou sua mente para resistir aos efeitos do Outro Lado. Seu foco e força de vontade fazem com que você expanda os limites de suas capacidades paranormais.","ab":[{"nex":10,"n":"Mente Sã","t":"Você compreende melhor as entidades do Outro Lado, e passa aser menos abalado por seus efeitos. Você recebe resistência paranormal +5 (+5 em testes de resistência contra efeitos paranormais)."},{"nex":40,"n":"Presença Poderosa","t":"Sua resiliéncia mental faz com que você possa extrair mais do Outro Lado. Você adiciona sua Presença ao seu limite de PE por turno, mas apenas para conjurar rituais (não para DT)."},{"nex":65,"n":"Inabalável","t":"Você recebe resistência a dano mentale paranormal 10. Além disso, quando é alvo de um efeito paranormal que permite um teste de Vontade para reduzir co dano a metade, você não sofre dano algum se passar."},{"nex":99,"n":"Presença do Medo","t":"Você aprende o ritual Presença do Medo."}]},{"n":"Lâmina Paranormal","prof":"Alguns ocultistas preferem ficar fechados em suas bibliotecas estudando livros e rituais. Outros preferem investigar fenémenos paranormais em sua fonte. Ja você, prefere usar o paranormal como uma arma. Você aprendeu e dominou técnicas de luta mesclando suas habilidades de conjuracao com suas capacidades de combate.","ab":[{"nex":10,"n":"Lâmina Maldita","t":"Você aprende o ritual Amaldigoar Arma. Se jé 0 conhece, seu custo é reduzido em —1 PE. Além disso, quando conjura esse ritual, você pode usar Ocultismo, em vez de Luta ou Pontaria, para testes de ataque com a arma amaldicoada."},{"nex":40,"n":"Gladiador Paranormal","t":"Sempre que acerta um ataque corpo a corpo em um inimigo, você recebe 2 PE temporarios. Você pode ganhar um máximo de PE temporérios por cena igual ao seu limite de PE. PE temporarios desaparecem no final da cena."},{"nex":65,"n":"Conjuração Marcial","t":"Uma vez por rodada, quando você lanca um ritual com execugao de uma ação padrão, pode gastar 2 PE para fazer um ataque corpo a corpo como uma acio livre."},{"nex":99,"n":"Lâmina do Medo","t":"Você aprende o ritual Lamina do Medo."}]}]},"PP":{"Conhecimento":[{"n":"Expansão de Conhecimento","t":"Permite adquirir um poder de classe de uma classe diferente da sua.","s":"Aprende 1 poder de outra classe.","p":"Conhecimento 1","a":"Pode adquirir um segundo poder de classe de outra classe.","as":"Pode adquirir um segundo poder de classe de outra classe."},{"n":"Percepção Paranormal","t":"Ao procurar pistas em investigação, pode rerrolar um dado cujo resultado seja inferior a 5, ficando com a nova rolagem.","s":"Procurar pistas: rerrola dado <5; mantém novo resultado.","p":"","a":"Pode rerrolar dado com resultado inferior a 10.","as":"Pode rerrolar dado com resultado inferior a 10."},{"n":"Precognição","t":"Recebe +5 nos testes de Esquiva contra ataques de adversários em alcance curto ou menor.","s":"Esquiva +5 contra inimigos em alcance curto ou menor.","p":"Conhecimento 1","a":"O bônus passa a valer em qualquer distância e você não pode ficar Desprevenido.","as":"O bônus passa a valer em qualquer distância e você não pode ficar Desprevenido."},{"n":"Sensitivo","t":"Recebe +1d em testes de Diplomacia, Intimidação e Intuição para interpretar e influenciar emoções e intenções.","s":"Diplomacia, Intimidação e Intuição: +1d.","p":"","a":"Em testes opostos com essas perícias, adversário sofre –1d.","as":"Em testes opostos com essas perícias, adversário sofre –1d."},{"n":"Visão do Oculto","t":"Enxerga normalmente na escuridão e ganha +1d em testes de Percepção relacionados à visão.","s":"Visão no escuro; Percepção visual +1d.","p":"Conhecimento 2","a":"Reduz em uma categoria a camuflagem do alvo.","as":"Reduz em uma categoria a camuflagem do alvo."}],"Energia":[{"n":"Afortunado","t":"Pode rerrolar um dado que tenha mostrado 1, exceto d20; cada dado só recebe essa chance uma vez por rolagem.","s":"Rerrola 1 em dados que não sejam d20; uma vez por rolagem.","p":"","a":"Uma vez por cena, também pode rerrolar resultado 1 em d20.","as":"Uma vez por cena, também pode rerrolar resultado 1 em d20."},{"n":"Sortudo","t":"Em investigação, a dificuldade de procurar pistas diminui uma categoria para você até encontrar uma pista.","s":"Procurar pistas: DT –1 categoria até encontrar pista.","p":"","a":"A redução de categoria da DT torna-se permanente.","as":"A redução de categoria da DT torna-se permanente."},{"n":"Golpe de Sorte","t":"Dobra a margem de ameaça base de seus ataques, antes de outros aumentos.","s":"Margem de ameaça dos ataques ×2 antes de outros bônus.","p":"Energia 2","a":"Acertos críticos recebem +1 dado de dano.","as":"Acertos críticos recebem +1 dado de dano."},{"n":"Manipular Entropia","t":"Uma vez por cena, pode fazer alvo em alcance curto rerrolar um dado de teste de perícia; deve decidir antes do mestre anunciar o resultado.","s":"1/cena; alvo curto: rerrola 1 dado de teste, antes do resultado.","p":"Energia 1","a":"Pode exigir rerrolagem de todos os dados do teste.","as":"Pode exigir rerrolagem de todos os dados do teste."},{"n":"Passou Raspando","t":"Recebe um dado adicional em testes de Reflexos.","s":"Reflexos +1d.","p":"Energia 1","a":"Reflexos +2d; sucesso em Reflexos que reduziria dano à metade passa a evitar todo dano.","as":"Reflexos +2d; sucesso em Reflexos que reduziria dano à metade passa a evitar todo dano."}],"Morte":[{"n":"Encarar a Morte","t":"Durante cenas de ação, aumenta em um ponto seu limite de PE por rodada.","s":"Cena de ação: limite PE/rodada +1.","p":"","a":"Limite PE/rodada +2.","as":"Limite PE/rodada +2."},{"n":"Escapar da Morte","t":"Uma vez por cena, quando um dano deixaria você com 0 PV ou menos, permanece com 1 PV. Não funciona contra dano massivo.","s":"1/cena: dano fatal → fica com 1 PV; exceto dano massivo.","p":"Morte 1","a":"Em vez disso evita todo o dano; contra dano massivo, fica com 1 PV.","as":"Em vez disso evita todo o dano; contra dano massivo, fica com 1 PV."},{"n":"Potencial Aprimorado","t":"Ganha +1 PE por nível de NEX de 5% (por exemplo, NEX 30% concede 6 PE), aumentando o bônus em 1 a cada novo avanço.","s":"PE máximos +1 por nível de 5% NEX (NEX30% = +6 PE).","p":"Morte 1","a":"Bônus passa a +2 PE por nível de NEX.","as":"Bônus passa a +2 PE por nível de NEX."},{"n":"Potencial Reaproveitado","t":"Uma vez por rodada, ao vencer um teste de resistência, recebe 1 PE temporário, que expira no fim da cena.","s":"1/rodada: sucesso em resistência → +1 PE temporário.","p":"","a":"Recebe 2 PE temporários.","as":"Recebe 2 PE temporários."},{"n":"Surto Temporal","t":"Uma vez por cena, durante seu turno, pode realizar uma ação padrão extra.","s":"1/cena: +1 ação padrão no turno.","p":"Morte 2","a":"Em vez de uma ação, realiza um turno inteiro adicional ao fim do turno atual.","as":"Em vez de uma ação, realiza um turno inteiro adicional ao fim do turno atual."}],"Sangue":[{"n":"Anatomia Insana","t":"Ao sofrer dano adicional de crítico ou Ataque Furtivo, tem 50% de chance de ignorar apenas esse dano adicional, determinado por resultado par em 1d4.","s":"50% (1d4 par) de ignorar dano extra de crítico/ataque furtivo.","p":"Sangue 1","a":"Imune aos efeitos de crítico e ataque furtivo.","as":"Imune aos efeitos de crítico e ataque furtivo."},{"n":"Arma de Sangue","t":"Pode gastar 2 PV para criar arma corporal leve especial de sangue até o fim da cena. Ao atacar, pode gastar 1 PE para fazer um ataque corpo a corpo adicional com essa arma.","s":"2 PV: cria arma de Sangue até fim da cena; ao atacar, 1 PE → +1 ataque com ela.","p":"","a":"Arma torna-se permanente e passa a causar dano de Sangue.","as":"Arma torna-se permanente e passa a causar dano de Sangue."},{"n":"Sangue de Ferro","t":"Recebe +3 PV e +1 PV por nível de NEX de 5%; o bônus cresce com o avanço do personagem.","s":"PV máximos +3 +1 por nível de 5% NEX.","p":"","a":"Imunidade a venenos e doenças.","as":"Imunidade a venenos e doenças."},{"n":"Sangue Fervente","t":"Enquanto estiver Machucado, recebe +1 em um dos atributos físicos Agilidade, Força ou Vigor, escolhido quando obtém o poder.","s":"Machucado: +1 em AGI, FOR ou VIG escolhido.","p":"Sangue 2","a":"Além do +1 inicial, recebe +1 em outros dois atributos físicos à escolha (AGI, FOR ou VIG).","as":"Além do +1 inicial, recebe +1 em outros dois atributos físicos à escolha (AGI, FOR ou VIG)."},{"n":"Sangue Vivo","t":"Na primeira vez que fica Machucado em uma cena, recebe Cura Acelerada 2. A regeneração não pode ultrapassar metade de seus PV máximos e termina se deixar de estar Machucado.","s":"1ª vez Machucado/cena: Cura Acelerada 2; máximo metade dos PV; termina se deixar Machucado.","p":"Sangue 1","a":"Cura Acelerada 5 e imunidade a traumas físicos enquanto o efeito estiver ativo.","as":"Cura Acelerada 5 e imunidade a traumas físicos enquanto o efeito estiver ativo."}]}};
const TRN={"Aniquilador":{"esp":"arma favorita, acertos críticos e dano.","pre":"","ab":{"A Favorita":{"nex":10,"t":"Escolha uma arma como sua favorita, como uma katana ou um fuzil de assalto. A categoria da arma escolhida é reduzida em I. A redução aumenta para II em NEX 40% (Técnica Secreta) e para III em NEX 99% (Máquina de Matar). A categoria não pode ficar abaixo de zero.","s":"Arma favorita: categoria −I (10%), −II (40%), −III (99%); mínimo 0."},"Técnica Secreta":{"nex":40,"t":"A categoria da arma favorita passa a ser reduzida em II. Quando ataca com ela, pode gastar 2 PE para aplicar um efeito especial ao ataque. **Amplo:** o ataque também pode atingir um alvo adicional ao alcance da arma e adjacente ao alvo original, usando o mesmo teste de ataque. **Destruidor:** aumenta o multiplicador de crítico da arma em +1. É possível adicionar mais efeitos pagando +2 PE por efeito.","s":"Ataque com arma favorita: 2 PE por efeito. **Amplo:** +1 alvo adjacente ao original (mesmo teste); **Destruidor:** multiplicador crítico +1."},"Técnica Sublime":{"nex":65,"t":"Acrescenta duas opções à Técnica Secreta. **Letal:** aumenta a margem de ameaça em +2; pode ser escolhido duas vezes, passando a conceder +5 no total. **Perfurante:** ignora até 5 pontos de RD de qualquer tipo do alvo. Aplicam-se os custos da Técnica Secreta.","s":"Novos efeitos (2 PE por efeito): **Letal:** margem +2, ou +5 se escolhido duas vezes; **Perfurante:** ignora 5 RD."},"Máquina de Matar":{"nex":99,"t":"A categoria da arma favorita passa a ser reduzida em III. Além disso, ela recebe permanentemente +2 na margem de ameaça e seu dano aumenta em um dado do mesmo tipo, sem custo adicional de PE.","s":"Arma favorita: categoria −III; margem de ameaça +2; dano +1 dado do mesmo tipo. Passivo."}}},"Comandante de Campo":{"esp":"liderança, ações adicionais e coordenação tática.","pre":"","ab":{"Inspirar Confiança":{"nex":10,"t":"Pode gastar uma reação e 2 PE para permitir que um aliado em alcance curto role novamente um teste que acabou de realizar.","s":"Reação + 2 PE: aliado em alcance curto repete teste recém-realizado."},"Estrategista":{"nex":40,"t":"Gaste uma ação padrão e 1 PE por aliado escolhido em alcance curto, até o máximo de aliados igual ao seu INT. No próximo turno de cada aliado afetado, ele recebe uma ação de movimento adicional.","s":"Ação padrão + 1 PE/aliado; alcance curto; até INT aliados; +1 ação de movimento no próximo turno deles."},"Brecha na Guarda":{"nex":65,"t":"Uma vez por rodada, quando um aliado causa dano a um inimigo em seu alcance curto, você pode gastar uma reação e 2 PE para que você ou outro aliado em alcance curto realize um ataque adicional contra esse mesmo inimigo. Além disso, o alcance de Inspirar Confiança e Estrategista aumenta para médio.","s":"1 vez/rodada; aliado causa dano → reação + 2 PE → você ou outro aliado em alcance curto faz +1 ataque contra o mesmo alvo. Alcance de Inspirar Confiança e Estrategista passa a médio."},"Oficial Comandante":{"nex":99,"t":"Gaste uma ação completa e 5 PE para conceder uma ação padrão adicional, no próximo turno, a cada aliado que você possa ver em alcance médio.","s":"Ação completa + 5 PE: aliados visíveis em alcance médio recebem +1 ação padrão no próximo turno."}}},"Guerreiro":{"esp":"combate corpo a corpo, manobras e contra-ataques.","pre":"","ab":{"Técnica Letal":{"nex":10,"t":"Todos os seus ataques corpo a corpo recebem +2 na margem de ameaça, sem custo de PE.","s":"Ataques corpo a corpo: margem de ameaça +2. Passivo."},"Revidar":{"nex":40,"t":"Quando utiliza a defesa especial Bloquear, pode gastar uma reação e 2 PE para realizar um ataque corpo a corpo contra o inimigo que realizou o ataque, desde que esteja ao alcance.","s":"Após Bloquear: reação + 2 PE → ataque corpo a corpo contra agressor ao alcance."},"Força Opressora":{"nex":65,"t":"Quando acerta um ataque corpo a corpo, pode gastar 1 PE para tentar uma manobra Derrubar ou Empurrar como ação livre. Ao **Empurrar**, recebe +5 no teste da manobra para cada 10 pontos de dano causados pelo ataque. Ao **Derrubar**, se vencer a manobra, pode gastar mais 1 PE para realizar imediatamente um ataque adicional contra o alvo derrubado.","s":"Acerto corpo a corpo + 1 PE → manobra livre. **Empurrar:** +5 no teste a cada 10 de dano; **Derrubar:** se vencer, +1 PE → ataque adicional."},"Potência Máxima":{"nex":99,"t":"Ao usar Ataque Especial com armas corpo a corpo, dobra os bônus numéricos obtidos com essa habilidade após distribuí-los. Por exemplo, bônus de +10 no ataque e +5 no dano passam a +20 e +10, respectivamente.","s":"Ataque Especial corpo a corpo: bônus numéricos ×2 após distribuição."}}},"Operações Especiais":{"esp":"iniciativa, ataques adicionais e economia de ações.","pre":"","ab":{"Iniciativa Aprimorada":{"nex":10,"t":"Recebe bônus permanente de +5 em testes de Iniciativa e uma ação de movimento adicional na primeira rodada, sem gastar PE.","s":"Iniciativa +5; +1 ação de movimento na primeira rodada. Passivo."},"Ataque Extra":{"nex":40,"t":"Uma vez por rodada, quando realiza um ataque, pode gastar 2 PE para realizar um ataque adicional sem precisar gastar outra ação padrão.","s":"1 vez/rodada; ao atacar, 2 PE → +1 ataque."},"Surto de Adrenalina":{"nex":65,"t":"Uma vez por rodada, pode gastar 5 PE para realizar uma ação adicional, escolhendo entre uma ação padrão ou uma ação de movimento.","s":"1 vez/rodada; 5 PE → +1 ação padrão **ou** de movimento."},"Sempre Alerta":{"nex":99,"t":"No início de uma cena de combate, recebe uma ação padrão adicional. O benefício ocorre no início da cena, não em todas as rodadas.","s":"+1 ação padrão no início de cada cena de combate. Passivo."}}},"Tropa de Choque":{"esp":"PV, bloqueio, proteção de aliados e sobrevivência.","pre":"","ab":{"Casca Grossa":{"nex":10,"t":"Recebe 1 PV adicional para cada 5% de NEX. Além disso, ao usar Bloquear, soma seu valor de VIG à RD normalmente concedida pelo bloqueio.","s":"+1 PV por 5% NEX; ao Bloquear, RD adicional = VIG."},"Cai Dentro":{"nex":40,"t":"Quando um inimigo em alcance curto ataca um aliado, pode gastar uma reação e 1 PE para tentar redirecionar o ataque a você. O inimigo realiza Vontade contra sua DT baseada em VIG; se falhar, deve atacar você. Você precisa estar em posição e alcance válidos para ser atacado. Se o inimigo passar no teste, fica imune a seu Cai Dentro até o fim da cena.","s":"Reação + 1 PE; inimigo em alcance curto ataca aliado → Vontade vs. DT VIG; falha: redireciona para você. Exige alcance válido; sucesso: imunidade até fim da cena."},"Duro de Matar":{"nex":65,"t":"Quando sofre dano não paranormal, pode gastar uma reação e 2 PE para reduzir esse dano à metade. Em NEX 85%, também pode usar a habilidade para reduzir dano paranormal.","s":"Reação + 2 PE → dano não paranormal ÷2; a partir de NEX 85%, também dano paranormal."},"Inquebrável":{"nex":99,"t":"Enquanto estiver Machucado, recebe +5 na Defesa e RD 5. Enquanto estiver Morrendo, não fica Indefeso e ainda pode realizar ações, mas continua sujeito às regras normais de morte.","s":"Machucado: Defesa +5 e RD 5. Morrendo: pode agir e não fica Indefeso; ainda pode morrer."}}},"Atirador de Elite":{"esp":"armas de fogo, críticos e manobras à distância.","pre":"","ab":{"Mira de Elite":{"nex":10,"t":"Recebe proficiência com armas de fogo longas e soma seu INT às rolagens de dano realizadas com essas armas. O bônus fixo não é multiplicado por acertos críticos.","s":"Proficiência com armas de fogo longas; dano com elas +INT. Passivo."},"Disparo Letal":{"nex":40,"t":"Quando realiza a ação Mirar, pode gastar 1 PE para aumentar em +2 a margem de ameaça do próximo ataque realizado até o fim de seu próximo turno. Não altera o multiplicador de crítico.","s":"Ao Mirar, 1 PE → margem de ameaça +2 no próximo ataque até fim do próximo turno (20 → 18–20)."},"Disparo Impactante":{"nex":65,"t":"Usando arma de fogo de calibre grosso, pode gastar 2 PE para realizar as manobras Derrubar, Desarmar, Empurrar ou Quebrar por meio de ataque à distância, respeitando as regras da manobra.","s":"Arma de fogo calibre grosso + 2 PE → Derrubar, Desarmar, Empurrar ou Quebrar à distância."},"Atirar para Matar":{"nex":99,"t":"Quando consegue um acerto crítico com arma de fogo, considera máximo o resultado dos dados de dano aplicáveis, sem rolá-los; bônus fixos são somados normalmente.","s":"Crítico com arma de fogo → dano máximo dos dados."}}},"Infiltrador":{"esp":"furtividade, dano furtivo e eliminação de alvos.","pre":"","ab":{"Ataque Furtivo":{"nex":10,"t":"Uma vez por rodada, ao acertar um alvo Desprevenido com ataque corpo a corpo ou em alcance curto, ou um alvo que esteja flanqueando, pode gastar 1 PE para causar dano extra do mesmo tipo da arma. O bônus é +1d6 em NEX 10%, +2d6 em 40%, +3d6 em 65% e +4d6 em 99%. Os dados extras não são multiplicados pelo crítico da arma.","s":"1 vez/rodada; acerto contra Desprevenido ou flanqueado + 1 PE → +1d6 (10%), +2d6 (40%), +3d6 (65%), +4d6 (99%) do tipo da arma."},"Gatuno":{"nex":40,"t":"Recebe +5 em Atletismo e Crime. Pode percorrer seu deslocamento normal ao se movimentar furtivamente e se esconder sem sofrer a penalidade de movimento aplicável, mas outras penalidades de Furtividade ainda podem existir.","s":"Atletismo +5; Crime +5; esconder-se percorrendo deslocamento normal sem penalidade de movimento."},"Assassinar":{"nex":65,"t":"Gaste uma ação de movimento e 3 PE para analisar um alvo em alcance curto. Até o fim de seu próximo turno, o primeiro Ataque Furtivo que causar dano a ele tem seus dados extras dobrados. Se o alvo sofrer dano desse ataque, deve passar em Fortitude contra sua DT baseada em AGI ou ficará Inconsciente ou Morrendo, à sua escolha.","s":"Movimento + 3 PE; alvo em alcance curto. Primeiro Ataque Furtivo com dano até fim do próximo turno: dados extras ×2. Fortitude vs. DT AGI; falha → Inconsciente ou Morrendo."},"Sombra Fugaz":{"nex":99,"t":"Quando faz teste de Furtividade após atacar ou realizar outra ação chamativa, pode gastar 3 PE para ignorar a penalidade de −15 normalmente aplicada. Ainda precisa realizar o teste e cumprir as condições para se esconder.","s":"3 PE → ignora −15 em Furtividade após ataque ou ação chamativa."}}},"Médico de Campo":{"esp":"cura, condições, resgate e reanimação.","pre":"treinado em Medicina.","ab":{"Paramédico":{"nex":10,"t":"Com ação padrão e 2 PE, cura 2d10 PV de aliado adjacente. Em NEX 40%, 65% e 99%, pode acrescentar 1d10 por patamar, pagando +1 PE por dado extra. Assim, pode chegar a 3d10 por 3 PE, 4d10 por 4 PE ou 5d10 por 5 PE, respectivamente.","s":"Ação padrão; aliado adjacente: 2 PE/2d10 (10%); 3 PE/3d10 (40%); 4 PE/4d10 (65%); 5 PE/5d10 (99%)."},"Equipe de Trauma":{"nex":40,"t":"Gaste uma ação padrão e 2 PE para remover uma condição negativa de aliado adjacente, exceto Morrendo.","s":"Ação padrão + 2 PE → remove 1 condição negativa de aliado adjacente, exceto Morrendo."},"Resgate":{"nex":65,"t":"Uma vez por rodada, se um aliado Machucado ou Morrendo estiver em alcance curto, pode aproximar-se dele como ação livre, percorrendo até seu deslocamento normal. Sempre que curar PV ou remover condição de um aliado, você e esse aliado recebem +5 na Defesa até o início do seu próximo turno. Além disso, o espaço ocupado por carregar outro personagem é reduzido pela metade para você.","s":"1 vez/rodada: aproximação livre de aliado Machucado/Morrendo em alcance curto (até deslocamento normal). Cura/remoção de condição → Defesa +5 para ambos. Carregar personagem: espaços ÷2."},"Reanimação":{"nex":99,"t":"Uma vez por cena, gaste uma ação completa e 10 PE para trazer de volta à vida um personagem que morreu durante a mesma cena, exceto se a morte ocorreu por dano massivo.","s":"1 vez/cena; ação completa + 10 PE → revive morto da mesma cena, exceto morte por dano massivo."}}},"Negociador":{"esp":"influência social, apoio e contatos.","pre":"","ab":{"Eloquência":{"nex":10,"t":"Gaste uma ação completa e 1 PE por alvo em alcance curto. Faça Diplomacia, Enganação ou Intimidação contra a Vontade dos alvos. Quem perder fica Fascinado enquanto você mantiver concentração (ação padrão por rodada). Alvos hostis ou em combate recebem +5 na resistência e novo teste a cada rodada de concentração. Quem passar fica imune ao efeito por um dia.","s":"Ação completa + 1 PE/alvo; alcance curto; Diplomacia/Enganação/Intimidação vs. Vontade → Fascinado. Concentração: padrão/rodada. Hostis: Vontade +5 e reteste/rodada. Sucesso: imune 1 dia."},"Discurso Motivador":{"nex":40,"t":"Gaste uma ação padrão e 4 PE para dar a você e aliados em alcance curto +1d20 em testes de perícia até o fim da cena. A partir de NEX 65%, pode gastar 8 PE para aumentar o benefício total a +2d20.","s":"Ação padrão; alcance curto; duração cena. 4 PE → +1d20 nos testes de perícia; NEX 65%: 8 PE → +2d20."},"Eu Conheço um Cara":{"nex":65,"t":"Uma vez por missão, pode acionar sua rede de contatos para pedir um favor relevante, como equipamento adicional, um local de descanso ou resgate. O mestre decide se e como o favor pode ser concedido.","s":"1 vez/missão → favor da rede de contatos; disponibilidade e limites definidos pelo mestre."},"Truque de Mestre":{"nex":99,"t":"Gaste 5 PE para simular uma habilidade que viu um aliado utilizar durante a cena. Ignora pré-requisitos, mas deve pagar todos os custos da habilidade copiada, inclusive ações, PE e materiais. Use os parâmetros do seu próprio personagem.","s":"5 PE + custos originais → copia habilidade vista de aliado na cena; ignora pré-requisitos; usa seus parâmetros."}}},"Técnico":{"esp":"inventário, conserto e improvisação de equipamentos.","pre":"","ab":{"Inventário Otimizado":{"nex":10,"t":"Soma INT à FOR para determinar a capacidade de carga. Por exemplo, FOR 1 e INT 3 equivalem a 20 espaços de inventário sem sobrecarga, seguindo a regra geral de 5 espaços por ponto de atributo.","s":"Capacidade de carga = 5 × (FOR + INT), respeitando regras de capacidade mínima e sobrecarga."},"Remendão":{"nex":40,"t":"Com uma ação completa e 1 PE, remove a condição Quebrado de um equipamento adjacente até o fim da cena. Além disso, qualquer equipamento geral tem a categoria reduzida em I para você, até o mínimo de zero.","s":"Ação completa + 1 PE → remove Quebrado de equipamento adjacente até fim da cena. Equipamento geral: categoria −I (mín. 0)."},"Improvisar":{"nex":65,"t":"Escolha um equipamento geral e gaste uma ação completa, 2 PE básicos e +2 PE por categoria do item. Você cria uma versão funcional do equipamento, que segue as regras normais de espaço e categoria. Ao final da cena, o equipamento improvisado se torna inútil.","s":"Ação completa + (2 PE + 2 PE × categoria) → equipamento geral improvisado até fim da cena; ocupa espaços normalmente."},"Preparado para Tudo":{"nex":99,"t":"Sempre que precisar de um item qualquer, exceto armas, pode gastar uma ação de movimento e 3 PE por categoria do item para declarar que o havia guardado no fundo da bolsa. Depois de encontrado, o item segue normalmente as regras de inventário e capacidade de carga.","s":"Ação de movimento + 3 PE × categoria → encontra qualquer item (exceto armas) na bolsa; respeita espaços."}}},"Conduíte":{"esp":"alcance, velocidade e anulação de rituais.","pre":"","ab":{"Ampliar Ritual":{"nex":10,"t":"Ao conjurar ritual, pode gastar +2 PE para aumentar seu alcance em um passo (curto → médio → longo → extremo) ou dobrar sua área de efeito. Não aumenta dano, DT ou duração por si só.","s":"+2 PE ao conjurar → alcance +1 passo **ou** área ×2."},"Acelerar Ritual":{"nex":40,"t":"Uma vez por rodada, pode gastar +4 PE ao conjurar um ritual para realizá-lo como ação livre, respeitando os demais custos e requisitos da conjuração.","s":"1 vez/rodada; +4 PE → ritual como ação livre."},"Anular Ritual":{"nex":65,"t":"Quando for alvo de ritual, pode pagar PE igual ao custo efetivamente gasto pelo conjurador e realizar teste oposto de Ocultismo. Se vencer, anula o ritual e todos os seus efeitos.","s":"Alvo de ritual → paga PE igual ao custo pago pelo conjurador; Ocultismo oposto; vitória → anula ritual."},"Canalizar o Medo":{"nex":99,"t":"Aprende o ritual Canalizar o Medo. A execução, o custo, o alcance e os efeitos seguem a descrição do próprio ritual.","s":"Aprende **Canalizar o Medo**; consultar ficha do ritual."}}},"Flagelador":{"esp":"sacrifício de PV e obtenção de PE temporários.","pre":"","ab":{"Poder do Flagelo":{"nex":10,"t":"Ao conjurar ritual, pode pagar parte ou todo o custo em PE gastando seus próprios PV na proporção de 2 PV por 1 PE substituído. Os PV gastos dessa forma só podem ser recuperados com descanso.","s":"Ao conjurar: 2 PV = 1 PE substituído. PV gastos só recuperam com descanso."},"Abraçar a Dor":{"nex":40,"t":"Quando sofre dano não paranormal, pode gastar uma reação e 2 PE para reduzir esse dano à metade.","s":"Reação + 2 PE → dano não paranormal ÷2."},"Absorver Agonia":{"nex":65,"t":"Sempre que um ritual seu reduzir um ou mais inimigos a 0 PV, você recebe PE temporários em quantidade igual ao círculo do ritual. A quantidade não é multiplicada pelo número de inimigos atingidos pelo mesmo ritual.","s":"Ritual reduz ≥1 inimigo a 0 PV → PE temporários = círculo do ritual."},"Medo Tangível":{"nex":99,"t":"Aprende o ritual Medo Tangível. Seus custos, requisitos e efeitos são os descritos na ficha do ritual.","s":"Aprende **Medo Tangível**; consultar ficha do ritual."}}},"Graduado":{"esp":"mais rituais conhecidos, grimório e aumento de DT.","pre":"","ab":{"Saber Ampliado":{"nex":10,"t":"Aprende um ritual adicional de 1º círculo. Sempre que obtiver acesso a um círculo novo, aprende mais um ritual daquele círculo. Esses rituais não contam no limite de rituais conhecidos.","s":"+1 ritual de 1º círculo; +1 ritual ao desbloquear cada círculo novo (2º, 3º, 4º). Não contam no limite."},"Grimório Ritualístico":{"nex":40,"t":"Cria um grimório especial que armazena rituais que sua mente não seria capaz de guardar: aprende rituais de 1º ou 2º círculo em quantidade igual ao seu INT. Quando ganha acesso a um novo círculo, pode incluir um novo ritual desse círculo no grimório. Esses rituais não contam no limite de rituais conhecidos. Para conjurar um ritual armazenado, precisa empunhar o grimório e gastar uma ação completa folheando-o para relembrar o ritual. O grimório ocupa 1 espaço no inventário; se for perdido, pode ser replicado com duas ações de interlúdio.","s":"Grimório: rituais de 1º/2º círculo = INT; +1 ritual ao ganhar novo círculo. Não contam no limite. Conjurar: empunhar + ação completa. Ocupa 1 espaço; replicável com 2 ações de interlúdio."},"Rituais Eficientes":{"nex":65,"t":"A DT dos testes de resistência contra todos os seus rituais aumenta em +5, sem custo de PE.","s":"DT dos rituais +5. Passivo."},"Conhecendo o Medo":{"nex":99,"t":"Aprende o ritual Conhecendo o Medo, que segue suas próprias regras de conjuração e efeito.","s":"Aprende **Conhecendo o Medo**; consultar ficha do ritual."}}},"Intuitivo":{"esp":"resistência paranormal, limite de PE e mitigação de dano mental.","pre":"","ab":{"Mente Sã":{"nex":10,"t":"Recebe +5 nos testes de resistência contra efeitos paranormais, sejam de Fortitude, Reflexos ou Vontade, quando aplicáveis. Não concede Defesa ou RD diretamente.","s":"Resistência contra efeitos paranormais: +5 nos testes. Passivo."},"Presença Poderosa":{"nex":40,"t":"Soma Presença ao limite de PE que pode gastar por rodada, exclusivamente para conjurar rituais. O aumento não se aplica a habilidades que não sejam rituais.","s":"Limite de PE/rodada para rituais: +Presença."},"Inabalável":{"nex":65,"t":"Recebe resistência a dano mental e paranormal 10. Quando um efeito paranormal permite teste de Vontade para reduzir dano à metade, um sucesso faz você não sofrer dano algum.","s":"RD mental/paranormal 10. Vontade bem-sucedida em efeito paranormal que reduziria dano à metade → 0 dano."},"Presença do Medo":{"nex":99,"t":"Aprende o ritual Presença do Medo, utilizando os custos e efeitos descritos na ficha do ritual.","s":"Aprende Presença do Medo; consultar ficha do ritual."}}},"Lâmina Paranormal":{"esp":"armas amaldiçoadas, ataques com Ocultismo e combate corpo a corpo.","pre":"","ab":{"Lâmina Maldita":{"nex":10,"t":"Aprende o ritual Amaldiçoar Arma. Se já o conhece, seu custo é reduzido em 1 PE. Além disso, quando conjura esse ritual, pode usar Ocultismo, em vez de Luta ou Pontaria, nos testes de ataque com a arma amaldiçoada.","s":"Aprende **Amaldiçoar Arma**; se já conhece, custo −1 PE. Arma amaldiçoada: ataque com Ocultismo em vez de Luta/Pontaria."},"Gladiador Paranormal":{"nex":40,"t":"Sempre que acerta ataque corpo a corpo contra inimigo, recebe 2 PE temporários. A quantidade total de PE temporários obtidos por essa habilidade em uma cena não pode superar seu limite de PE por rodada. Os pontos desaparecem ao fim da cena.","s":"Acerto corpo a corpo → +2 PE temporários. Total recebido na cena limitado ao limite de PE/rodada. Expiram no fim da cena."},"Conjuração Marcial":{"nex":65,"t":"Uma vez por rodada, quando lança um ritual com execução de ação padrão, pode gastar 2 PE para realizar um ataque corpo a corpo como ação livre, além da conjuração.","s":"1 vez/rodada; conjura ritual de ação padrão + 2 PE → +1 ataque corpo a corpo como ação livre."},"Lâmina do Medo":{"nex":99,"t":"Aprende o ritual Lâmina do Medo. Os custos, alcance, execução e efeitos seguem a ficha específica do ritual.","s":"Aprende **Lâmina do Medo**; consultar ficha do ritual."}}}};
Object.values(D).forEach(cl=>(cl.tr||[]).forEach(t=>{let x=TRN[t.n];if(!x)return;t.esp=x.esp;if(x.pre)t.pre=x.pre;t.ab.forEach(a=>{let y=x.ab[a.n];if(y){a.t=y.t;a.s=y.s}})}));
const CPW={"Combatente":[{"n":"Acuidade com Arma","t":"Permite substituir Força por Agilidade nos testes de ataque e nas rolagens de dano ao usar uma arma corpo a corpo leve ou arma de arremesso.","s":"Arma leve ou arremesso: AGI no lugar de FOR para ataque e dano.","p":"Agi 2"},{"n":"Armamento Pesado","t":"Concede proficiência com armas pesadas, permitindo utilizá-las sem a penalidade associada à falta de proficiência.","s":"Proficiência com armas pesadas.","p":"For 2"},{"n":"Ataque de Oportunidade","t":"Quando um inimigo sai voluntariamente de um espaço adjacente ao seu, você pode gastar uma reação e 1 PE para atacá-lo.","s":"Inimigo sai voluntariamente de espaço adjacente → reação + 1 PE: 1 ataque.","p":""},{"n":"Combater com Duas Armas","t":"Ao executar a ação Agredir portando duas armas, das quais ao menos uma seja leve, você pode atacar uma vez com cada arma. Em troca, sofre penalidade de –1 dado em todos os testes de ataque até o próximo turno.","s":"Agredir com 2 armas (≥1 leve) → 2 ataques, –1d em ataques até próximo turno.","p":"Agi 3, treinado em Luta ou Pontaria"},{"n":"Combate Defensivo","t":"Ao usar a ação Agredir, você pode escolher uma postura defensiva: sofre –1 dado em todos os testes de ataque até seu próximo turno, mas recebe +5 na Defesa nesse período.","s":"Ao Agredir: –1d em ataques e Defesa +5 até próximo turno.","p":"Int 2"},{"n":"Golpe Demolidor","t":"Ao executar a manobra Quebrar ou atacar um objeto, pode gastar 1 PE para acrescentar dois dados de dano do mesmo tipo dos dados de sua arma.","s":"Contra objetos/manobra Quebrar: 1 PE → +2 dados de dano da arma.","p":"For 2, treinado em Luta"},{"n":"Golpe Pesado","t":"O dano de suas armas corpo a corpo aumenta em mais um dado do mesmo tipo.","s":"Armas corpo a corpo: +1 dado de dano do mesmo tipo.","p":""},{"n":"Incansável","t":"Uma vez por cena, pode gastar 2 PE para realizar uma ação de investigação adicional, desde que utilize Força ou Agilidade como atributo-base do teste dessa ação.","s":"1 vez/cena: 2 PE → +1 ação de investigação; teste baseado em FOR ou AGI.","p":""},{"n":"Presteza Atlética","t":"Ao fazer um teste para Facilitar a Investigação, pode gastar 1 PE e utilizar Força ou Agilidade no lugar do atributo-base da perícia. Se obtiver sucesso, o próximo aliado que aproveitar o bônus também recebe +1 dado no teste.","s":"Facilitar Investigação: 1 PE → usa FOR/AGI; sucesso concede +1d adicional ao próximo aliado beneficiado.","p":""},{"n":"Proteção Pesada","t":"Concede proficiência com proteções pesadas. Só pode ser selecionado a partir de NEX 30%.","s":"Proficiência com proteções pesadas.","p":"NEX 30%"},{"n":"Reflexos Defensivos","t":"Você recebe +2 em Defesa e em testes de resistência.","s":"Defesa e testes de resistência +2.","p":"Agi 2"},{"n":"Saque Rápido","t":"Você pode sacar ou guardar itens como uma ação livre (em vez de ação de movimento). Além disso, caso esteja usando a regra opcional de contagem de munição, uma vez por rodada pode recarregar uma arma de disparo como uma ação livre.","s":"Sacar/guardar itens: ação livre. Regra opcional de munição: 1×/rodada recarrega arma de disparo como ação livre.","p":"treinado em Iniciativa"},{"n":"Segurar o Gatilho","t":"Ao acertar um ataque com arma de fogo, pode realizar outro contra o mesmo alvo. O primeiro ataque extra custa 1 PE, o segundo custa 2 PE e assim sucessivamente, conforme o número de ataques já realizados no turno. A sequência termina quando não houver PE disponível dentro do limite por rodada ou quando a arma precisar ser recarregada.","s":"Após acerto com arma de fogo: ataque extra no mesmo alvo; custos sucessivos 1, 2, 3… PE. Limitado por PE/rodada e munição.","p":"NEX 60%"},{"n":"Sentido Tático","t":"Você pode gastar uma ação de movimento e 2 PE para analisar o ambiente. Se fizer isso, recebe um bônus em Defesa e em testes de resistência igual ao seu Intelecto até o final da cena.","s":"Movimento + 2 PE: Defesa e resistências +Intelecto até o fim da cena.","p":"Int 2, treinado em Percepção e Tática"},{"n":"Tanque de Guerra","t":"Quando usa uma proteção pesada, aumenta em +2 a Defesa e em +2 a resistência a dano concedidas por ela.","s":"Com proteção pesada: Defesa fornecida +2 e RD fornecida +2.","p":"Proteção Pesada"},{"n":"Tiro Certeiro","t":"Ao utilizar uma arma de disparo, acrescenta sua Agilidade ao dano e ignora a penalidade de disparar contra alvos envolvidos em combate corpo a corpo, mesmo sem utilizar Mirar.","s":"Arma de disparo: dano +AGI; ignora penalidade de tiro em combate corpo a corpo.","p":"treinado em Pontaria"},{"n":"Tiro de Cobertura","t":"Gasta uma ação padrão e 1 PE para disparar em direção a um alvo dentro do alcance da arma de fogo, visando suprimi-lo, não causar dano. Faz Pontaria contra Vontade. Se vencer, até o início do próximo turno o alvo não pode sair de sua posição e sofre –5 em ataques. O mestre pode conceder +5 à Vontade do alvo se permanecer no lugar for muito perigoso. É um efeito de medo.","s":"Padrão + 1 PE; Pontaria × Vontade. Vitória: alvo imóvel na posição e –5 em ataques até início do próximo turno. Medo; Vontade +5 em local extremamente perigoso, a critério do mestre.","p":""},{"n":"Transcender","t":"Escolha um poder paranormal e receba seus benefícios, sofrendo a perda de Sanidade prevista pelas regras de Transcender. Pode escolher este poder mais de uma vez, adquirindo poderes paranormais adicionais conforme os requisitos aplicáveis.","s":"Recebe 1 poder paranormal; aplica perda de SAN. Pode escolher várias vezes.","p":""},{"n":"Treinamento em Perícia","t":"Escolha duas perícias e torne-se treinado nelas. A partir de NEX 35%, pode escolher perícias nas quais já seja treinado para elevá-las a veterano. A partir de NEX 70%, pode elevar perícias veteranas a expert. Pode escolher este poder várias vezes.","s":"Escolhe 2 perícias: treinado; em NEX ≥35% pode elevar treinado→veterano; ≥70% veterano→expert. Repetível.","p":""},{"n":"Artista Marcial","t":"Seus ataques desarmados causam 1d6 pontos de dano, podem causar dano letal e contam como armas ágeis. Em NEX 35%, o dano aumenta para 1d8 e, em NEX 70%, para 1d10.","s":"Ataques desarmados: 1d6 letal, ágeis; 1d8 em NEX 35%, 1d10 em NEX 70%.","p":""}],"Especialista":[{"n":"Acuidade com Arma","t":"Permite substituir Força por Agilidade nos testes de ataque e dano com armas corpo a corpo leves ou de arremesso.","s":"AGI substitui FOR em ataque e dano com arma leve ou arremesso.","p":"Agi 2"},{"n":"Balística Avançada","t":"Concede proficiência com armas táticas de fogo e acrescenta +2 às rolagens de dano feitas com essas armas.","s":"Proficiência com armas táticas de fogo; dano +2 com elas.","p":""},{"n":"Conhecimento Aplicado","t":"Quando realiza um teste de perícia que não seja Luta ou Pontaria, pode gastar 2 PE para utilizar Intelecto como atributo-base no lugar do atributo habitual.","s":"2 PE → usa INT no teste de perícia, exceto Luta/Pontaria.","p":"Int 2"},{"n":"Hacker","t":"Recebe +5 em testes de Tecnologia para invadir sistemas. Também pode executar a invasão de qualquer sistema em uma ação completa, independentemente da DT.","s":"Hackear: Tecnologia +5; tempo de invasão = ação completa.","p":"treinado em Tecnologia"},{"n":"Mãos Rápidas","t":"Ao realizar um teste de Crime, pode pagar 1 ponto de esforço para executar a atividade como ação livre.","s":"Teste de Crime: 1 PE → ação livre.","p":"Agi 3, treinado em Crime"},{"n":"Mochila de Utilidades","t":"Um item à sua escolha (exceto armas) conta como uma categoria abaixo e ocupa 1 espaço a menos.","s":"1 item (exceto arma): categoria –1 e –1 espaço.","p":""},{"n":"Movimento Tático","t":"Pode gastar 1 PE para ignorar a penalidade de deslocamento de terreno difícil e receber deslocamento de escalada igual ao seu deslocamento normal até o final do turno.","s":"1 PE → ignora terreno difícil e ganha escalada = deslocamento até fim do turno.","p":"treinado em Atletismo"},{"n":"Na Trilha Certa","t":"Quando obtém sucesso em um teste para procurar pistas durante uma cena de interação, pode gastar 1 PE para receber +1 dado no próximo teste. O bônus e o custo são cumulativos: após um segundo sucesso, pode gastar 2 PE para acumular +2 dados no teste seguinte, e assim por diante.","s":"Sucesso ao procurar pistas em cena de interação: 1 PE → +1d no próximo teste; acúmulos posteriores custam 2 PE/+2d, 3 PE/+3d etc.","p":""},{"n":"Nerd","t":"Uma vez por cena, pode gastar 2 PE e fazer Atualidades DT 20. Em caso de sucesso, obtém do mestre uma informação útil à cena, como uma pista investigativa ou uma vulnerabilidade de inimigo.","s":"1 vez/cena: 2 PE + Atualidades DT 20 → informação útil para a cena.","p":""},{"n":"Ninja Urbano","t":"Concede proficiência com armas táticas corpo a corpo e +2 nas rolagens de dano realizadas com elas.","s":"Proficiência com armas táticas corpo a corpo; dano +2 com elas.","p":""},{"n":"Pensamento Ágil","t":"Uma vez por rodada, durante uma cena de investigação, pode gastar 2 PE para realizar uma ação adicional de procurar pistas.","s":"1 vez/rodada em investigação: 2 PE → +1 ação de procurar pistas.","p":""},{"n":"Perito em Explosivos","t":"Acrescenta seu Intelecto à DT dos testes de resistência contra explosivos que você utiliza. Além disso, pode excluir dos efeitos da explosão um número de alvos igual ao seu Intelecto.","s":"Explosivos: DT de resistência +INT; exclui até INT alvos da explosão.","p":""},{"n":"Primeira Impressão","t":"Recebe +2 dados no primeiro teste de Diplomacia, Enganação, Intimidação ou Intuição que fizer em cada cena.","s":"Primeiro teste social da cena (Diplomacia/Enganação/Intimidação/Intuição): +2d.","p":""},{"n":"Transcender","t":"Escolha um poder paranormal e receba seus benefícios, sofrendo a perda de Sanidade prevista pelas regras de Transcender. Pode escolher este poder mais de uma vez, adquirindo poderes paranormais adicionais conforme os requisitos aplicáveis.","s":"Recebe 1 poder paranormal; aplica perda de SAN. Pode escolher várias vezes.","p":""},{"n":"Treinamento em Perícia","t":"Escolha duas perícias e torne-se treinado nelas. A partir de NEX 35%, pode escolher perícias nas quais já seja treinado para elevá-las a veterano. A partir de NEX 70%, pode elevar perícias veteranas a expert. Pode escolher este poder várias vezes.","s":"Escolhe 2 perícias: treinado; em NEX ≥35% pode elevar treinado→veterano; ≥70% veterano→expert. Repetível.","p":""}],"Ocultista":[{"n":"Camuflar Ocultismo","t":"Pode usar ação livre para ocultar símbolos e sigilos gravados na pele ou em objetos, tornando-os invisíveis a outras pessoas. Ao lançar um ritual, pode pagar 2 PE adicionais para dispensar gestos e fala, conjurando apenas com concentração, mesmo amarrado ou amordaçado. Observadores precisam passar em Ocultismo DT 20 para perceber a conjuração.","s":"Ação livre: oculta símbolos/sigilos. Ritual +2 PE: dispensa gestos/fala; perceber conjuração exige Ocultismo DT 20.","p":""},{"n":"Envolto em Mistério","t":"Sua aparência e postura podem influenciar pessoas supersticiosas ou desconhecedoras do paranormal. Como orientação geral, recebe +5 em Enganação e Intimidação contra pessoas não treinadas em Ocultismo; o mestre decide a aplicação contextual.","s":"Enganação +5 e Intimidação +5 contra pessoas sem treinamento em Ocultismo; aplicação depende do mestre.","p":""},{"n":"Especialista em Elemento","t":"Escolha um elemento paranormal. A DT dos testes de resistência contra seus rituais desse elemento aumenta em 2 pontos.","s":"Escolhe elemento: DT de resistência dos rituais desse elemento +2.","p":""},{"n":"Ferramentas Paranormais","t":"Uma vez por cena, pode ativar um equipamento paranormal sem pagar o custo de ativação. Custos de manutenção cobrados por rodada ainda precisam ser pagos normalmente.","s":"1 vez/cena: ativação de equipamento paranormal sem custo inicial; custos por rodada permanecem.","p":""},{"n":"Fluxo de Poder","t":"Pode sustentar simultaneamente dois efeitos de rituais com uma única ação livre, desde que pague separadamente o custo de manutenção de cada efeito.","s":"1 ação livre mantém 2 rituais sustentados; paga PE de ambos.","p":"NEX 60%"},{"n":"Guiado pelo Paranormal","t":"Uma vez por cena, pode gastar 2 PE para executar uma ação de investigação adicional.","s":"1 vez/cena: 2 PE → +1 ação de investigação.","p":""},{"n":"Identificação Paranormal","t":"Recebe +10 nos testes de Ocultismo feitos para identificar criaturas, objetos ou rituais.","s":"Ocultismo +10 para identificar criatura, objeto ou ritual.","p":""},{"n":"Intuição Paranormal","t":"Quando utiliza a ação Facilitar Investigação, acrescenta seu Intelecto ou sua Presença ao teste, escolhendo um dos dois atributos.","s":"Facilitar Investigação: soma INT ou PRE ao teste.","p":""},{"n":"Mestre em Elemento","t":"Escolha um elemento para o qual já possui Especialista em Elemento. O custo para conjurar rituais desse elemento é reduzido em 1 PE.","s":"Rituais do elemento escolhido: custo –1 PE.","p":"Especialista em Elemento, NEX 45%"},{"n":"Ritual Potente","t":"Você soma seu Intelecto nas rolagens de dano ou nos efeitos de cura de seus rituais.","s":"Rituais: dano ou cura +Intelecto.","p":"Int 2"},{"n":"Ritual Predileto","t":"Escolha um ritual que você conhece. O custo desse ritual é reduzido em 1 PE, e essa redução pode se acumular com outras reduções de custo aplicáveis.","s":"1 ritual conhecido: custo –1 PE; acumula com outras reduções.","p":""},{"n":"Tatuagem Ritualística","t":"Símbolos inscritos em sua pele reduzem em 1 PE o custo de rituais de alcance pessoal que tenham você como alvo.","s":"Rituais de alcance pessoal direcionados a si: custo –1 PE.","p":""},{"n":"Transcender","t":"Escolha um poder paranormal e receba seus benefícios, sofrendo a perda de Sanidade prevista pelas regras de Transcender. Pode escolher este poder mais de uma vez, adquirindo poderes paranormais adicionais conforme os requisitos aplicáveis.","s":"Recebe 1 poder paranormal; aplica perda de SAN. Pode escolher várias vezes.","p":""},{"n":"Treinamento em Perícia","t":"Escolha duas perícias e torne-se treinado nelas. A partir de NEX 35%, pode escolher perícias nas quais já seja treinado para elevá-las a veterano. A partir de NEX 70%, pode elevar perícias veteranas a expert. Pode escolher este poder várias vezes.","s":"Escolhe 2 perícias: treinado; em NEX ≥35% pode elevar treinado→veterano; ≥70% veterano→expert. Repetível.","p":""},{"n":"Criar Selo","t":"Você sabe fabricar selos paranormais de rituais que conheça (veja a página 151). Fabricar um selo gasta uma ação de interlúdio e um número de PE igual ao custo de conjurar o ritual. Você pode ter um número máximo de selos criados a qualquer momento igual à sua Presença.","s":"Fabrica selos de rituais conhecidos (ação de interlúdio, PE = custo do ritual); máx. de selos = Presença.","p":""},{"n":"Improvisar Componentes","t":"Uma vez por cena, você pode gastar uma ação completa para fazer um teste de Investigação (DT 15). Se passar, encontra objetos que podem servir como componentes ritualísticos de um elemento à sua escolha. O mestre define se é possível usar esse poder na cena atual.","s":"1×/cena: ação completa + Investigação DT 15 → acha componentes ritualísticos de um elemento.","p":""}]};Object.keys(CPW).forEach(cl=>{let L=D[cl].pow;CPW[cl].forEach(x=>{let p=L.find(z=>z.n==x.n);if(p){p.t=x.t;p.s=x.s;p.p=x.p}else L.push({n:x.n,t:x.t,s:x.s,p:x.p})});L.sort((a,b)=>a.n.localeCompare(b.n,'pt'))});

 imobilizar criaturas do Outro Lado que sejam vulnerdveis ao elemento que as compéem e podem ser usadas de duas formas.","Câmera de Aura Paranormal":"Esta cdmera amaldigoada com Energia possui sigilos de Conhecimento para capturar auras paranormais. Tirar uma foto gasta uma ação padrdo e 1 PE. As fotos sao instantaneas e revelam a presenga de auras paranormais em pessoas e objetos. As auras sao da cor associada ao elemento.","Componentes Ritualísticos de (Elemento)":"Um conjunto de objetos utilizados em rituais de um elemento entre Sangue, Morte, Conhecimento ou Energia (não existem componentes ritualisticos de Medo). Componentes ritualisticos sao necessarios para conjuracio de rituais do elemento em questo.","Emissor de Pulsos Paranormais":"Esta pequena caixa coberta de sigilos foi desenvolvida para servir como uma “isca” de criaturas paranormais. Ativar a caixa gasta uma ado completa e 1 PE. A caixa emite um pulso de um elemento definido pelo ativador, que atrai criaturas do mesmo elemento e afasta criaturas do elemento oposto, As criaturas afetadas tém direito a um teste de Vontade (DT Pre) para evitar o efeito.","Escuta de Ruídos Paranormais":"Este microfone funciona como um aparato espido, com a diferenca que consegue captar ruidos paranormais. Ativar a escuta gasta uma ação completa e 2 PE e faz. com que ela grave ruidos por até 24 horas. Ouvir a escuta fornece +5 em testes de Ocultismo para identificar criatura.","Medidor de Estabilidade da Membrana":"Um dispositivo complexo, composto por diversos medidores — de temperatura, campo magnético, dilatagao temporal... Um agente treinado em Ocultismo pode usar o medidor para avaliar 0 estado da Membrana em uma drea (veja a pagina 97), 0 que indica a chance de uma entidade se manifestar nela. Um ambiente com valores racionais e constantes a0 longo de algumas horas dificilmente originara uma criatura ou manifestacao perigosa. Porém, se as leituras apresentarem dados inexplicaveis ou com grandes variagGes, o lugar pod

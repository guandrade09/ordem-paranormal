Compreensão Paranormal|O ritual confere a você compreensão sobrenatural da linguagem. Você pode focar num texto ou gravação para entender as palavras mesmo que não conheça o idioma, contanto que se trate de um idioma humano mundano (não funciona com símbolos ou sigilos paranormais). Se tocar em outra pessoa, pode se comunicar com ela mesmo como se falassem o mesmo idioma em comum. Se tocar uma criatura não inteligente, como um animal, pode perceber seus sentimentos básicos, como medo ou felicidade. Um alvo involuntário tem direito a um teste de Vontade.|muda o alcance para curto e o alvo para alvos escolhidos. Você pode entender todos os alvos afeta dos. Requer 2º círculo.|muda o alcance para pessoal e o alvo para você. Em vez do normal, você pode falar, entender e escrever qualquer idioma humano. Requer 3º círculo.

Terceiro Olho|Seus olhos se enchem de sigilos e passam a enxergar auras paranormais. Este efeito é similar ao uso de Ocultismo para detectar o paranormal, mas você detecta todas as auras paranormais em alcance médio e recebe todas as informações sobre elas sem gastar ações. Além disso, você pode gastar uma ação de movimento para descobrir se uma pessoa que pode ver em alcance médio tem poderes paranormais ou se é capaz de conjurar rituais e de quais elementos.|muda a duração para 1 dia.|também pode enxergar objetos e criaturas invisíveis, que aparecem como formas translúcidas.

Transfigurar Água|Você pode canalizar a Energia para que a água tenha movimentos e comportamentos sobrenaturais de forma caótica. Ao conjurar o ritual, escolha um dos efeitos abaixo. Congelar: toda a água mundana na área é congelada. Criaturas nadando na área ficam imóveis; escapar exige gastar uma ação padrão e passar num teste de Atletismo ou Acrobacia. Derreter: gelo mundano na área vira água e a ritual termina. A critério do mestre, isso pode criar terreno difícil. Enchente: eleva o nível da água munda na na área em até 4,5m. A sua escolha, muda área para alvo: uma embarcação. O alvo recebe +3m em seu deslocamento pela duração do efeito. Evaporar: toda a água e gelo mundano na área evaporam instantaneamente e o ritual termina. Qualquer ser vivo na área sofre 5d8 de dano de Energia (Fortitude reduz à metade). Criaturas de Morte sofrem o dobro desse dano. Partir: diminui o nível de toda água mundana na área em até 4,5m. Em um corpo d’água raso, isso abre um caminho seco, que pode ser atravessado a pé. Em um corpo d’água profundo, cria um redemoinho que pode prender barcos (um teste de Pilotagem com DT igual à do ritual permite ao piloto livrar a embarcação).||aumenta o deslocamento de enchente para +9m e o dano de evaporar para 10d8.
Transfusão Vital|Você toca no alvo e transfere sua própria energia vital para ele, podendo sofrer até 30 pontos de dano de Sangue para que o alvo recupere a mesma quantidade em PV. Você não pode ficar com menos de 1 PV por causa desse ritual.|Você pode transferir até 50 pontos de vida. Requer 3º círculo.|Você pode transferir até 100 pontos de vida. Requer 4º círculo.
Velocidade Mortal|Você distorce a maneira como o alvo interage com a passagem do tempo, tornando-o impossivelmente veloz. O alvo pode realizar uma ação de movimento adicional por turno. Esta ação não pode ser usada para conjurar rituais.|Muda a duração para sustentada. O alvo pode realizar uma ação padrão ou de movimento adicional por turno. Uma criatura só pode receber uma ação adicional por turno como efeito deste ritual.|muda o alvo para alvos escolhidos no alcance. Requer 4º círculo.
Vidência|Através de uma superfície reflexiva, como um espelho ou mesmo uma TV desligada, você pode ver e ouvir uma criatura escolhida e seus arredores (cerca de 6m em qualquer direção), mesmo que ela se mova. O alvo pode estar a qualquer distância, mas tem direito a um teste de resistência por rodada para impedir a vidência. Se o alvo passar em três testes seguidos, o ritual é encerrado e o alvo fica imune ao ritual por uma semana. O alvo recebe bônus ou penalidades em seu teste de resistência, dependendo do conhecimento que você tiver dela. I Você não conhece o alvo: +15. I Você ouviu falar do alvo: +10. I Você nunca interagiu com o alvo pessoalmente: +5. I Já encontrou o alvo pessoalmente: +0. I Tem uma fotografia ou imagem clara do alvo: –2. I Conhece bem o alvo: –5. I Tem um pertence pessoal ou peça de roupa do alvo: –5. I Tem uma parte do corpo do alvo (unhas, cabelos...): –10.||
Visão da Verdade|Você enxerga a forma real das coisas. Você pode ver através de camuflagem (normal e total), escuridão (normal e paranormal) e efeitos de ilusão e transformação (como Forma Monstruosa), enxergando a verdade como sigilos do Outro Lado formando silhuetas translúcidas e sobrepostas.|além do normal, você fica com sentidos e perspicácia apurados, recebendo +10 em todos os testes de Percepção e de Intuição.|além do normal, você enxerga através de paredes e barreiras com 30cm de espessura ou menos (as paredes e barreiras parecem translúcidas).
Vomitar Pestes|Você vomita um enxame de pequenas criaturas de Sangue, que surge em um ponto adjacente a sua escolha. O enxame pode passar pelo espaço de outras criaturas e não impede que outras criaturas entrem no espaço dele. No final de cada um de seus turnos, o enxame causa 5d12 pontos de dano de sangue a qualquer criatura em seu espaço (Reflexos reduz à metade). Você pode gastar uma ação de movimento para mover o enxame com deslocamento de 12m.|além do normal, um alvo que falhe no teste de Reflexos fica agarrada (o enxame escala e cobre o corpo dela). O alvo pode gastar uma ação padrão e fazer um teste de Acrobacia ou Atletismo para escapar. Se você mover o enxame, o alvo fica livre.|o enxame vira Enorme (cubo de 6m de lado), ganha deslocamento de voo 18m e passa a ocupar um cubo ao invés de um quadrado.
Vínculo de Sangue|Você manifesta um símbolo de sangue no corpo do alvo e no seu próprio. Enquanto o efeito durar, sempre que você sofrer dano, o alvo deve fazer um teste de Fortitude. Se falhar, você recebe apenas metade do dano e o alvo a metade restante. Alternativamente, você pode inverter o efeito do ritual quando o conjurar, fazendo com que você receba metade de todo o dano que o alvo receber. Alvos voluntários não precisam fazer testes de resistência.||
Zerar Entropia|Você zera completamente a entropia do alvo em relação ao ambiente, deixando-o paralisado. Se passar na resistência, em vez disso fica lento. A cada rodada, pode gastar uma ação completa para fazer um novo teste de Vontade. Se passar, se liberta do efeito.|muda o alvo para 1 criatura. Requer 4º círculo.|muda o alvo para criaturas escolhidas. Requer 4º círculo.
Âncora Temporal|O alvo é envolvido por uma aura espiralada que distorce o tempo ao seu redor. No início de cada um se seus turnos, ele deve fazer um teste de Vontade. Se passar, pode se mover normalmente naquela rodada. Se falhar, a aura o impede de sair do lugar. O efeito termina se o alvo tiver dois sucessos consecutivos no teste de Vontade.||muda o alvo para “criaturas ou objetos à sua escolha”. Requer 4º círculo.`.split('\n').map(l=>{let a=l.split('|');return[a[0],a.slice(1)]})),ATN={Força:'FOR',Agilidade:'AGI',Vigor:'VIG',Intelecto:'INT',Presença:'PRE'},md=t=>t.replace(/(Força|Agilidade|Vigor|Intelecto|Presença)(?!\s*\(\d)(?! do Medo)|([+−–]?\d+d\d+(?:[+-]\d+)?|[+−–]?\d+d(?![A-Za-zÀ-ÿ\d])|[+−]?\d+(?:[.,]\d+)?%?)/g,(m,a,n)=>a?`<b class=nm>${a}${MDC&&MDC.attr?` (${MDC.attr[ATN[a]]})`:''}</b>`:`<b class=nm>${n}</b>`).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
